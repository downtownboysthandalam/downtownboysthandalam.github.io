<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments - Downtown Boys Thandalam</title>
  <style>
    body { font-family: "Georgia", serif; background-color: #f7f4ed; color: #2b2b2b; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border: 2px solid #8c6d3b; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #4a3728; border-bottom: 2px double #8c6d3b; padding-bottom: 10px; margin-top: 0; }
    .card { background: #faf9f6; border: 1px solid #dcd1c4; padding: 15px; margin-top: 20px; border-radius: 2px; }
    .card h3 { margin: 0 0 5px 0; color: #8c6d3b; }
    .card p { font-size: 13px; color: #555; margin: 5px 0 15px 0; }
    .btn { display: block; text-align: center; padding: 10px; background: #4a3728; color: #fff; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .btn:hover { background: #6b503b; }
    .back-link { display: block; margin-top: 20px; text-align: center; font-size: 13px; color: #8c6d3b; text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Active Tournaments</h2>

    <div class="card">
      <h3>Carrom Board Tournament</h3>
      <p>Annual doubles tournament open for local residents. Register your team below.</p>
      <a href="./carrom/" class="btn">Register Team</a>
    </div>

    <a href="../" class="back-link">← Back to Home</a>
  </div>

</body>
</html>
